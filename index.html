<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Partículas 3D con Control de Gestos</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #111; }
        canvas { display: block; }
        #videoElement {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
            opacity: 0; /* Ocultamos el video pero lo mantenemos para MediaPipe */
            transform: scaleX(-1); /* Espejo para que se vea como un espejo */
        }
        .info-overlay {
            position: absolute;
            top: 10px;
            right: 25px;
            color: white;
            font-family: sans-serif;
            font-size: 14px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 5px;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3/camera_utils.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tweakpane@3.1.1/dist/tweakpane.min.js"></script>
</head>
<body>
    <video id="videoElement" autoplay></video>
    <div id="container"></div>
    <div class="info-overlay">
        **Instrucciones:**
        <br>
        1. **Control de Distancia (Escala):** Mueve la mano hacia o lejos de la cámara.
        <br>
        2. **Disparador (Efecto):** Cierra el puño para activar la forma/efecto (ej. encender el corazón, disparar el cohete/fuego artificial).
    </div>

    <script>
        // --- 1. Variables Globales y Configuración ---
        let scene, camera, renderer, particles, geometry;
        let particleCount = 10000;
        let positions, velocities, colors;
        let clock = new THREE.Clock();

        // Control de MediaPipe
        let videoElement = document.getElementById('videoElement');
        let hands, cameraUtil;

        // Gestos
        let isHandClosed = false;
        let isHandDetected = false;
        let handZ = 0; // Profundidad de la mano (para escala)

        // Configuración de la interfaz (Tweakpane)
        const CONFIG = {
            shape: 'corazon',
            color: '#FF00AA',
            speed: 0.05,
            particleSize: 0.5,
            effectActive: false,
        };

        // --- 2. Inicialización de Three.js ---

        function initThree() {
            // Escena
            scene = new THREE.Scene();

            // Cámara (Configuración para coincidir con la perspectiva de la cámara)
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 25;

            // Renderizador
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('container').appendChild(renderer.domElement);

            // Inicializar partículas
            initParticles();

            // Interfaz
            initGUI();

            // Manejo de redimensionamiento
            window.addEventListener('resize', onWindowResize, false);

            // Iniciar el bucle de animación
            animate();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- 3. Generación de Plantillas de Partículas ---

        // Función de utilidad para generar una curva de corazón (Cardioide)
        function generateHeartPositions(count, radius = 10) {
            const tempPositions = [];
            for (let i = 0; i < count; i++) {
                // Parámetro 't' de 0 a 2*PI
                const t = (i / count) * 2 * Math.PI;
                // Ecuaciones de la Cardioide para el corazón
                const x = radius * (16 * Math.sin(t) ** 3) / 10;
                const y = -radius * (
                    13 * Math.cos(t) -
                    5 * Math.cos(2 * t) -
                    2 * Math.cos(3 * t) -
                    Math.cos(4 * t)
                ) / 10;
                const z = 0; // Lo mantenemos 2D, Three.js lo mapea a 3D
                tempPositions.push(x, y, z);
            }
            return tempPositions;
        }

        // Función de utilidad para generar una forma de flor (Rosa)
        function generateFlowerPositions(count, radius = 10, petals = 5) {
            const tempPositions = [];
            for (let i = 0; i < count; i++) {
                const t = (i / count) * 2 * Math.PI;
                const r = radius * Math.cos(petals * t); // Ecuación de la rosa
                const x = r * Math.cos(t);
                const y = r * Math.sin(t);
                const z = 0;
                tempPositions.push(x, y, z);
            }
            return tempPositions;
        }

        // Función de utilidad para generar la forma de Saturno (Anillo y Esfera)
        function generateSaturnPositions(count, radius = 10) {
            const tempPositions = [];
            // Mitad para el anillo, mitad para el planeta
            const countHalf = Math.floor(count / 2);

            // Planeta (Esfera)
            for (let i = 0; i < countHalf; i++) {
                const r = Math.random() * radius * 0.4;
                const phi = Math.acos(Math.random() * 2 - 1);
                const theta = Math.random() * 2 * Math.PI;

                const x = r * Math.sin(phi) * Math.cos(theta);
                const y = r * Math.sin(phi) * Math.sin(theta);
                const z = r * Math.cos(phi);
                tempPositions.push(x, y, z);
            }

            // Anillo
            const ringRadius = radius * 0.7;
            const ringThickness = radius * 0.1;
            for (let i = 0; i < count - countHalf; i++) {
                const r = ringRadius + Math.random() * ringThickness;
                const theta = Math.random() * 2 * Math.PI;

                const x = r * Math.cos(theta);
                const y = r * Math.sin(theta);
                // Distribución aleatoria muy pequeña en Z
                const z = (Math.random() - 0.5) * 0.2;
                tempPositions.push(x, y, z);
            }
            return tempPositions;
        }

        // Función para cambiar la forma de las partículas
        function changeShape(shape) {
            const newPositions = [];

            switch (shape) {
                case 'corazon':
                    newPositions.push(...generateHeartPositions(particleCount));
                    break;
                case 'flor':
                    newPositions.push(...generateFlowerPositions(particleCount));
                    break;
                case 'saturno':
                    newPositions.push(...generateSaturnPositions(particleCount));
                    break;
                case 'fuegosartificiales':
                    // Para fuegos artificiales, se inicia en un punto, la forma se crea en el 'animate'
                    for (let i = 0; i < particleCount; i++) {
                        newPositions.push(0, 0, 0); // Todas en el centro
                    }
                    break;
                case 'esfera':
                default:
                    // Esfera 3D estándar (random)
                    for (let i = 0; i < particleCount; i++) {
                        const radius = 15;
                        const phi = Math.acos(Math.random() * 2 - 1);
                        const theta = Math.random() * 2 * Math.PI;

                        const x = radius * Math.sin(phi) * Math.cos(theta);
                        const y = radius * Math.sin(phi) * Math.sin(theta);
                        const z = radius * Math.cos(phi);
                        newPositions.push(x, y, z);
                    }
            }

            // Actualizar la geometría
            positions = new Float32Array(newPositions);
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.attributes.position.needsUpdate = true;

            // Reiniciar las velocidades para que no haya artefactos de la forma anterior
            for (let i = 0; i < particleCount * 3; i += 3) {
                velocities[i] = (Math.random() - 0.5) * 0.01;
                velocities[i + 1] = (Math.random() - 0.5) * 0.01;
                velocities[i + 2] = (Math.random() - 0.5) * 0.01;
            }
        }

        // Inicializador principal de partículas
        function initParticles() {
            geometry = new THREE.BufferGeometry();
            positions = new Float32Array(particleCount * 3);
            velocities = new Float32Array(particleCount * 3);
            colors = new Float32Array(particleCount * 3);

            // Inicializar colores (simplemente blanco al inicio)
            const color = new THREE.Color(CONFIG.color);
            for (let i = 0; i < particleCount * 3; i += 3) {
                colors[i] = color.r;
                colors[i + 1] = color.g;
                colors[i + 2] = color.b;

                // Inicializar velocidades aleatorias muy bajas (para un movimiento sutil)
                velocities[i] = (Math.random() - 0.5) * 0.01;
                velocities[i + 1] = (Math.random() - 0.5) * 0.01;
                velocities[i + 2] = (Math.random() - 0.5) * 0.01;
            }

            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            // Cargar la forma inicial
            changeShape(CONFIG.shape);

            // Material
            const material = new THREE.PointsMaterial({
                size: CONFIG.particleSize,
                vertexColors: true, // Habilitar el uso de los colores de los vértices
                transparent: true,
                blending: THREE.AdditiveBlending, // Efecto de brillo/superposición
                depthWrite: false, // Optimización
            });

            particles = new THREE.Points(geometry, material);
            scene.add(particles);

            // Aplicar el tamaño inicial
            particles.material.size = CONFIG.particleSize;
        }

        // --- 4. Interfaz de Usuario (Tweakpane) ---

        function initGUI() {
            const pane = new Tweakpane.Pane({ title: 'Controles de Partículas' });

            // Carpeta de Forma
            const shapeFolder = pane.addFolder({ title: 'Forma de la Partícula' });
            shapeFolder.addBinding(CONFIG, 'shape', {
                options: {
                    'Corazón ❤️': 'corazon',
                    'Flor 🌸': 'flor',
                    'Saturno 🪐': 'saturno',
                    'Fuegos Artificiales 🎇': 'fuegosartificiales',
                    'Esfera (Aleatorio) 🌐': 'esfera',
                },
            }).on('change', (ev) => {
                changeShape(ev.value);
            });

            // Carpeta de Estilo
            const styleFolder = pane.addFolder({ title: 'Estilo' });
            styleFolder.addBinding(CONFIG, 'color', { view: 'color' }).on('change', (ev) => {
                const newColor = new THREE.Color(ev.value);
                // Actualizar el color de todas las partículas
                for (let i = 0; i < particleCount * 3; i += 3) {
                    colors[i] = newColor.r;
                    colors[i + 1] = newColor.g;
                    colors[i + 2] = newColor.b;
                }
                geometry.attributes.color.needsUpdate = true;
            });

            styleFolder.addBinding(CONFIG, 'particleSize', { label: 'Tamaño', min: 0.1, max: 2.0 }).on('change', (ev) => {
                particles.material.size = ev.value;
            });
        }

        // --- 5. Lógica de MediaPipe (Detección de Gestos) ---

        function initMediaPipe() {
            hands = new Hands({
                locateFile: (file) => {
                    return `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/${file}`;
                }
            });

            hands.setOptions({
                maxNumHands: 2,
                modelComplexity: 1, // 1 es un buen equilibrio para precisión y rendimiento
                minDetectionConfidence: 0.5,
                minTrackingConfidence: 0.5
            });

            hands.onResults(onResults);

            // Acceso a la cámara
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                cameraUtil = new Camera(videoElement, {
                    onFrame: async () => {
                        await hands.send({ image: videoElement });
                    },
                    width: 1280, // Resolución más alta para mejor detección
                    height: 720
                });
                cameraUtil.start();
            } else {
                console.error("No se pudo acceder a la cámara.");
            }
        }

        function onResults(results) {
            isHandDetected = results.multiHandLandmarks && results.multiHandLandmarks.length > 0;

            if (isHandDetected) {
                const landmarks = results.multiHandLandmarks[0]; // Usamos la primera mano detectada

                // **Control de Profundidad (Z) para la Escala**
                // El punto 0 (muñeca) o 9 (centro) es bueno para la profundidad
                // Normalizado de 0 (cámara) a 1 (lejos)
                // Invertimos el eje Z para que al acercar la mano (Z bajo) las partículas crezcan.
                handZ = 1 - landmarks[9].z;
                // Mapeo simple: ajusta la sensibilidad
                const scaleFactor = 0.5 + handZ * 2.0; // Rango de escala 0.5 a 2.5
                particles.material.size = CONFIG.particleSize * scaleFactor;

                // **Control de Cierre de Mano (Puño) para el Disparador**
                // Un puño se detecta cuando la punta de los dedos (8, 12, 16, 20) está cerca del nudillo (5, 9, 13, 17)
                const tipIndexes = [8, 12, 16, 20]; // Índice, Medio, Anular, Meñique (puntas)
                const knuckleIndexes = [5, 9, 13, 17]; // Nudillos
                let closedCount = 0;

                for (let i = 0; i < tipIndexes.length; i++) {
                    // Distancia Euclidea simple entre la punta y el nudillo correspondiente.
                    // No usamos Math.hypot porque los landmarks son 3D.
                    const distSq = (landmarks[tipIndexes[i]].x - landmarks[knuckleIndexes[i]].x) ** 2 +
                                   (landmarks[tipIndexes[i]].y - landmarks[knuckleIndexes[i]].y) ** 2 +
                                   (landmarks[tipIndexes[i]].z - landmarks[knuckleIndexes[i]].z) ** 2;

                    // Umbral de distancia (debe ser muy bajo, ya que es la distancia normalizada [0, 1])
                    if (distSq < 0.005) { // Este valor puede requerir calibración
                        closedCount++;
                    }
                }

                // Si la mayoría de los dedos están cerca, consideramos que la mano está cerrada.
                const newIsHandClosed = closedCount >= 3;

                // **Lógica del Disparador (Puño CERRADO -> Activar Efecto)**
                if (newIsHandClosed && !isHandClosed) {
                    // Solo se activa una vez al pasar de ABIERTO a CERRADO
                    CONFIG.effectActive = true;
                } else if (!newIsHandClosed && isHandClosed) {
                    // Solo se desactiva una vez al pasar de CERRADO a ABIERTO
                    CONFIG.effectActive = false;
                }
                isHandClosed = newIsHandClosed;

            } else {
                // Si la mano no es detectada, restablecer a tamaño normal
                particles.material.size = CONFIG.particleSize;
                CONFIG.effectActive = false; // Detener efecto si la mano desaparece
            }
        }

        // --- 6. Bucle de Animación y Lógica de Partículas ---

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta(); // Tiempo transcurrido para una animación suave

            // Movimiento/Física Base de las partículas
            for (let i = 0; i < particleCount * 3; i += 3) {
                // Posiciones actuales
                let x = positions[i];
                let y = positions[i + 1];
                let z = positions[i + 2];

                // Velocidades actuales
                let vx = velocities[i];
                let vy = velocities[i + 1];
                let vz = velocities[i + 2];

                // **Lógica de Efectos (Gestos)**

                if (CONFIG.shape === 'fuegosartificiales' && CONFIG.effectActive) {
                    // 1. Inicializar la explosión una vez
                    if (y === 0 && vx === 0) { // Si están quietas en el centro (solo la primera vez)
                         // Impulso aleatorio fuerte
                         const speed = 5 + Math.random() * 5;
                         vx = (Math.random() - 0.5) * speed;
                         vy = (Math.random() - 0.5) * speed;
                         vz = (Math.random() - 0.5) * speed;
                    }
                    
                    // 2. Aplicar la gravedad y desvanecimiento
                    vy -= 9.8 * delta * 0.1; // Gravedad simulada (aceleración hacia abajo)
                    
                    // 3. Reducir la velocidad por fricción
                    vx *= 0.98;
                    vy *= 0.98;
                    vz *= 0.98;

                    // Reiniciar si caen por debajo de la 'pantalla'
                    if (y < -30) {
                        x = 0; y = 0; z = 0; // Volver al centro
                        vx = 0; vy = 0; vz = 0; // Detener
                        // Desactivar el efecto para que se necesite otro gesto
                        // (Nota: CONFIG.effectActive se controla en onResults, se mantiene)
                    }

                } else {
                    // Movimiento sutil de 'vida' (para todas las demás formas)
                    const lifeSpeed = 0.05;
                    const time = clock.elapsedTime * lifeSpeed;

                    // Posición base
                    const baseIndex = i / 3;
                    const basePos = positions[i]; // No actualizaremos esta posición base

                    // Pequeña oscilación usando Seno/Coseno
                    vx = Math.sin(time + baseIndex) * 0.05;
                    vy = Math.cos(time + baseIndex) * 0.05;
                    vz = Math.sin(time * 0.5 + baseIndex) * 0.05;
                }

                // Aplicar la velocidad a la posición
                x += vx * CONFIG.speed * 5;
                y += vy * CONFIG.speed * 5;
                z += vz * CONFIG.speed * 5;

                // Almacenar las nuevas posiciones y velocidades
                positions[i] = x;
                positions[i + 1] = y;
                positions[i + 2] = z;

                velocities[i] = vx;
                velocities[i + 1] = vy;
                velocities[i + 2] = vz;
            }

            // Notificar a Three.js que las posiciones han cambiado
            geometry.attributes.position.needsUpdate = true;

            // Renderizar la escena
            renderer.render(scene, camera);
        }

        // --- 7. Arranque Principal ---
        initThree();
        initMediaPipe();
    </script>
</body>
</html>
