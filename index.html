<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Partículas 3D con Control de Gestos Avanzado</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #111; }
        canvas { display: block; }
        #videoElement {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
            opacity: 0; /* Ocultamos el video pero lo mantenemos para MediaPipe */
            transform: scaleX(-1); /* Espejo para que se vea como un espejo */
        }
        .info-overlay {
            position: absolute;
            top: 10px;
            right: 10px;
            color: white;
            font-family: sans-serif;
            font-size: 14px;
            z-index: 1000; /* Aseguramos que esté sobre todo */
            background: rgba(0, 0, 0, 0.6);
            padding: 10px;
            border-radius: 5px;
            pointer-events: none; /* No bloquear clicks en el canvas */
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3/camera_utils.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tweakpane@3.1.1/dist/tweakpane.min.js"></script>
</head>
<body>
    <video id="videoElement" autoplay></video>
    <div id="container"></div>
    <div class="info-overlay">
        **Instrucciones:**
        <br>
        1. **Escala/Zoom:** Mueve la mano hacia o lejos de la cámara.
        <br>
        2. **Disparador:** **Cierra el puño** para activar el efecto (ej. explosión).
    </div>

    <script>
        // --- 1. Variables Globales y Configuración ---
        let scene, camera, renderer, particles, geometry;
        let particleCount = 10000;
        let positions, velocities, colors, initialPositions; // Añadimos initialPositions para guardar la forma
        let clock = new THREE.Clock();

        // Control de MediaPipe
        let videoElement = document.getElementById('videoElement');
        let hands, cameraUtil;

        // Gestos
        let isHandClosed = false;
        let isHandDetected = false;
        let handZ = 0;
        let isExploding = false; // Control de estado para fuegos artificiales

        // Configuración de la interfaz (Tweakpane)
        const CONFIG = {
            shape: 'corazon',
            color: '#FF00AA',
            speedMultiplier: 0.1,
            particleSize: 0.5,
            effectActive: false,
        };

        // --- 2. Inicialización de Three.js ---

        function initThree() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 25;

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('container').appendChild(renderer.domElement);

            initParticles();
            initGUI();
            window.addEventListener('resize', onWindowResize, false);
            animate();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- 3. Generación de Plantillas de Partículas ---

        // Función de utilidad para generar una curva de corazón (Cardioide)
        function generateHeartPositions(count, radius = 10) {
            const tempPositions = [];
            for (let i = 0; i < count; i++) {
                const t = (i / count) * 2 * Math.PI;
                const x = radius * (16 * Math.sin(t) ** 3) / 10;
                const y = -radius * (
                    13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)
                ) / 10;
                const z = 0;
                tempPositions.push(x, y, z);
            }
            return tempPositions;
        }

        // Función de utilidad para generar una forma de flor (Rosa)
        function generateFlowerPositions(count, radius = 10, petals = 5) {
            const tempPositions = [];
            for (let i = 0; i < count; i++) {
                const t = (i / count) * 2 * Math.PI;
                const r = radius * Math.cos(petals * t);
                const x = r * Math.cos(t);
                const y = r * Math.sin(t);
                const z = 0;
                tempPositions.push(x, y, z);
            }
            return tempPositions;
        }

        // Función de utilidad para generar la forma de Saturno (Anillo y Esfera)
        function generateSaturnPositions(count, radius = 10) {
            const tempPositions = [];
            const countHalf = Math.floor(count / 2);

            // Planeta (Esfera)
            for (let i = 0; i < countHalf; i++) {
                const r = Math.random() * radius * 0.4;
                const phi = Math.acos(Math.random() * 2 - 1);
                const theta = Math.random() * 2 * Math.PI;

                const x = r * Math.sin(phi) * Math.cos(theta);
                const y = r * Math.sin(phi) * Math.sin(theta);
                const z = r * Math.cos(phi);
                tempPositions.push(x, y, z);
            }

            // Anillo
            const ringRadius = radius * 0.7;
            const ringThickness = radius * 0.1;
            for (let i = 0; i < count - countHalf; i++) {
                const r = ringRadius + Math.random() * ringThickness;
                const theta = Math.random() * 2 * Math.PI;

                const x = r * Math.cos(theta);
                const y = r * Math.sin(theta);
                const z = (Math.random() - 0.5) * 0.2;
                tempPositions.push(x, y, z);
            }
            return tempPositions;
        }

        // Función para cambiar la forma de las partículas
        function changeShape(shape) {
            const newPositions = [];
            isExploding = false; // Reiniciar estado de explosión

            switch (shape) {
                case 'corazon':
                    newPositions.push(...generateHeartPositions(particleCount));
                    break;
                case 'flor':
                    newPositions.push(...generateFlowerPositions(particleCount));
                    break;
                case 'saturno':
                    newPositions.push(...generateSaturnPositions(particleCount));
                    break;
                case 'fuegosartificiales':
                    // Para fuegos artificiales, se inicia en un punto (base)
                    for (let i = 0; i < particleCount; i++) {
                        newPositions.push(0, -10, 0); // Todas abajo, listas para subir
                    }
                    break;
                case 'esfera':
                default:
                    // Esfera 3D estándar (random)
                    for (let i = 0; i < particleCount; i++) {
                        const radius = 15;
                        const phi = Math.acos(Math.random() * 2 - 1);
                        const theta = Math.random() * 2 * Math.PI;

                        const x = radius * Math.sin(phi) * Math.cos(theta);
                        const y = radius * Math.sin(phi) * Math.sin(theta);
                        const z = radius * Math.cos(phi);
                        newPositions.push(x, y, z);
                    }
            }

            // Almacenar las posiciones iniciales (la forma)
            initialPositions = new Float32Array(newPositions);

            // Copiar las posiciones iniciales a las posiciones dinámicas
            positions = new Float32Array(initialPositions);
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.attributes.position.needsUpdate = true;

            // Reiniciar velocidades a valores sutiles
            for (let i = 0; i < particleCount * 3; i += 3) {
                velocities[i] = (Math.random() - 0.5) * 0.01;
                velocities[i + 1] = (Math.random() - 0.5) * 0.01;
                velocities[i + 2] = (Math.random() - 0.5) * 0.01;
            }

            // Aplicar color
            updateColors(CONFIG.color);
        }

        // Función para actualizar los colores de todas las partículas
        function updateColors(hexColor) {
            const newColor = new THREE.Color(hexColor);
            for (let i = 0; i < particleCount * 3; i += 3) {
                colors[i] = newColor.r;
                colors[i + 1] = newColor.g;
                colors[i + 2] = newColor.b;
            }
            geometry.attributes.color.needsUpdate = true;
        }


        // Inicializador principal de partículas
        function initParticles() {
            geometry = new THREE.BufferGeometry();
            velocities = new Float32Array(particleCount * 3);
            colors = new Float32Array(particleCount * 3);

            // Inicializar partículas
            for (let i = 0; i < particleCount * 3; i++) {
                velocities[i] = 0;
            }

            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            // Cargar la forma inicial
            changeShape(CONFIG.shape);

            // Material
            const material = new THREE.PointsMaterial({
                size: CONFIG.particleSize,
                vertexColors: true,
                transparent: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
            });

            particles = new THREE.Points(geometry, material);
            scene.add(particles);

            particles.material.size = CONFIG.particleSize;
        }

        // --- 4. Interfaz de Usuario (Tweakpane) ---

        function initGUI() {
            const pane = new Tweakpane.Pane({ title: 'Controles 3D' });

            // Carpeta de Forma
            const shapeFolder = pane.addFolder({ title: 'Plantillas' });
            shapeFolder.addBinding(CONFIG, 'shape', {
                options: {
                    'Corazón ❤️': 'corazon',
                    'Flor 🌸': 'flor',
                    'Saturno 🪐': 'saturno',
                    'Fuegos Artificiales 🎇': 'fuegosartificiales',
                    'Esfera 🌐': 'esfera',
                },
            }).on('change', (ev) => {
                changeShape(ev.value);
            });

            // Carpeta de Estilo
            const styleFolder = pane.addFolder({ title: 'Estilo y Velocidad' });
            styleFolder.addBinding(CONFIG, 'color', { view: 'color' }).on('change', (ev) => {
                updateColors(ev.value);
            });

            styleFolder.addBinding(CONFIG, 'particleSize', { label: 'Tamaño', min: 0.1, max: 2.0 }).on('change', (ev) => {
                particles.material.size = ev.value;
            });

            styleFolder.addBinding(CONFIG, 'speedMultiplier', { label: 'Velocidad', min: 0.01, max: 0.5 }).on('change', (ev) => {
                // Ajuste de velocidad base
            });
        }

        // --- 5. Lógica de MediaPipe (Detección de Gestos) ---

        function initMediaPipe() {
            // Se usa la ruta CDN completa para garantizar la carga en GitHub Pages
            hands = new Hands({
                locateFile: (file) => {
                    return `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/${file}`;
                }
            });

            hands.setOptions({
                maxNumHands: 1, // Una mano es suficiente para el control
                modelComplexity: 1,
                minDetectionConfidence: 0.7, // Aumentamos la confianza
                minTrackingConfidence: 0.7
            });

            hands.onResults(onResults);

            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                cameraUtil = new Camera(videoElement, {
                    onFrame: async () => {
                        await hands.send({ image: videoElement });
                    },
                    width: 640,
                    height: 480
                });
                cameraUtil.start();
            } else {
                console.error("No se pudo acceder a la cámara.");
            }
        }

        function onResults(results) {
            isHandDetected = results.multiHandLandmarks && results.multiHandLandmarks.length > 0;

            if (isHandDetected) {
                const landmarks = results.multiHandLandmarks[0];

                // **Control de Profundidad (Z) para la Escala**
                // landmarks[9].z (centro del nudillo)
                handZ = 1 - landmarks[9].z;
                const scaleFactor = 0.5 + handZ * 2.5; // Rango de escala 0.5 a 3.0
                particles.material.size = CONFIG.particleSize * scaleFactor;

                // **Control de Cierre de Mano (Puño) para el Disparador**
                const tipIndexes = [8, 12, 16, 20]; // Puntas de dedos
                const knuckleIndexes = [5, 9, 13, 17]; // Nudillos
                let closedCount = 0;

                for (let i = 0; i < tipIndexes.length; i++) {
                    const distSq = (landmarks[tipIndexes[i]].x - landmarks[knuckleIndexes[i]].x) ** 2 +
                                   (landmarks[tipIndexes[i]].y - landmarks[knuckleIndexes[i]].y) ** 2;

                    if (distSq < 0.003) { // Umbral ajustado para alta sensibilidad al puño
                        closedCount++;
                    }
                }

                const newIsHandClosed = closedCount >= 3;

                // Lógica del Disparador (Transición de ABIERTO a CERRADO)
                if (newIsHandClosed && !isHandClosed) {
                    CONFIG.effectActive = true;
                } else {
                    CONFIG.effectActive = false; // Desactivar efecto tan pronto como se abra
                }
                isHandClosed = newIsHandClosed;

            } else {
                particles.material.size = CONFIG.particleSize;
                CONFIG.effectActive = false;
            }
        }

        // --- 6. Bucle de Animación y Lógica de Partículas ---

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();

            for (let i = 0; i < particleCount * 3; i += 3) {
                let x = positions[i];
                let y = positions[i + 1];
                let z = positions[i + 2];

                let vx = velocities[i];
                let vy = velocities[i + 1];
                let vz = velocities[i + 2];

                // **Lógica de Fuegos Artificiales**
                if (CONFIG.shape === 'fuegosartificiales') {

                    // Disparador de la Explosión
                    if (CONFIG.effectActive && !isExploding) {
                        // Iniciar el cohete
                        if (y === initialPositions[i+1] || y < -5) { // Si están en la base o ya cayeron
                            // Lanzar hacia arriba con una velocidad inicial alta
                            vy = 30 + Math.random() * 10;
                            isExploding = true; // Activar el estado de lanzamiento
                        }
                    }

                    // En vuelo (antes de la explosión)
                    if (isExploding && vy > 0) {
                        vy -= 9.8 * delta * 0.1; // Gravedad simulada
                    }

                    // Momento de la explosión (Cuando la velocidad Y es cercana a cero o la altura es máxima)
                    if (isExploding && vy <= 0 && y > 10) {
                        // Explosión radial
                        const speed = 10 + Math.random() * 5;
                        const angle = Math.random() * 2 * Math.PI;
                        const inclination = Math.random() * Math.PI;

                        vx = speed * Math.sin(inclination) * Math.cos(angle);
                        vy = speed * Math.sin(inclination) * Math.sin(angle);
                        vz = speed * Math.cos(inclination);
                        
                        // Una vez que se inicia la explosión, ya no es el cohete subiendo
                        isExploding = false;
                    }
                    
                    // Movimiento después de la explosión
                    if (!isExploding && y > initialPositions[i+1]) {
                        vy -= 9.8 * delta * 0.2; // Aceleración de gravedad más fuerte
                        vx *= 0.99; // Fricción
                        vz *= 0.99;
                    }

                    // Reinicio si cae por debajo de la base
                    if (y < initialPositions[i+1] && !CONFIG.effectActive) {
                        y = initialPositions[i+1]; // Posición de base
                        vx = 0; vy = 0; vz = 0;
                    }
                }
                // **Lógica de Formas Estáticas (Corazón, Flor, Saturno, Esfera)**
                else {
                    // Mover ligeramente las partículas para que no estén estáticas
                    const baseIndex = i / 3;
                    const time = clock.elapsedTime * 0.5;

                    // Volver a la posición inicial (la forma) con una fuerza de resorte
                    const returnForce = 0.01;
                    const dx = initialPositions[i] - x;
                    const dy = initialPositions[i + 1] - y;
                    const dz = initialPositions[i + 2] - z;

                    vx += dx * returnForce;
                    vy += dy * returnForce;
                    vz += dz * returnForce;

                    // Agitar o Pulsar (reacción al gesto CERRAR)
                    if (CONFIG.effectActive) {
                        const shakeFactor = 0.5;
                        vx += (Math.random() - 0.5) * shakeFactor;
                        vy += (Math.random() - 0.5) * shakeFactor;
                        vz += (Math.random() - 0.5) * shakeFactor;
                    }

                    // Pequeño movimiento de "vida" (perlin noise simulado)
                    vx += Math.sin(time + baseIndex) * 0.005;
                    vy += Math.cos(time + baseIndex) * 0.005;
                    vz += Math.sin(time * 0.5 + baseIndex) * 0.005;

                    // Fricción/Amortiguamiento
                    vx *= 0.95;
                    vy *= 0.95;
                    vz *= 0.95;
                }

                // Aplicar la velocidad a la posición
                x += vx * CONFIG.speedMultiplier * 5;
                y += vy * CONFIG.speedMultiplier * 5;
                z += vz * CONFIG.speedMultiplier * 5;

                // Almacenar las nuevas posiciones y velocidades
                positions[i] = x;
                positions[i + 1] = y;
                positions[i + 2] = z;

                velocities[i] = vx;
                velocities[i + 1] = vy;
                velocities[i + 2] = vz;
            }

            geometry.attributes.position.needsUpdate = true;
            renderer.render(scene, camera);
        }

        // --- 7. Arranque Principal ---
        initThree();
        initMediaPipe();
    </script>
</body>
</html>
