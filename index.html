<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Partículas Gestual 3D</title>
    
    <style>
        body { margin: 0; overflow: hidden; background-color: #050505; font-family: 'Segoe UI', sans-serif; }
        
        /* Contenedor de Video (Oculto visualmente pero activo) */
        .input_video { display: none; }
        
        /* Canvas 3D */
        #canvas3d { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }

        /* Interfaz de Usuario (Glassmorphism) */
        #ui-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 280px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            z-index: 10;
            color: white;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
            transition: opacity 0.3s;
        }

        h2 { margin: 0 0 15px 0; font-size: 1.2rem; font-weight: 600; letter-spacing: 1px; }
        p { font-size: 0.85rem; color: #ccc; margin-bottom: 15px; }

        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        
        button {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 8px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9rem;
        }

        button:hover { background: rgba(255, 255, 255, 0.3); transform: translateY(-2px); }
        button.active { background: #00d2ff; color: #000; border-color: #00d2ff; font-weight: bold; }

        label { display: block; margin-bottom: 5px; font-size: 0.9rem; }
        input[type="color"] { width: 100%; border: none; height: 35px; cursor: pointer; border-radius: 5px; }

        #loading {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #00d2ff; font-size: 1.5rem; z-index: 20; font-weight: bold;
            text-shadow: 0 0 10px rgba(0,210,255,0.5);
            pointer-events: none;
        }
        
        .status-dot {
            height: 10px; width: 10px; background-color: #ff4444; border-radius: 50%;
            display: inline-block; margin-right: 5px; box-shadow: 0 0 5px #ff4444;
        }
        .status-active { background-color: #00ff88; box-shadow: 0 0 5px #00ff88; }

    </style>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

    <div id="loading">Cargando IA y Modelos 3D...</div>

    <div id="ui-panel">
        <h2><span id="cam-status" class="status-dot"></span>Control Gestual</h2>
        <p>Abre la mano para expandir, cierra para contraer. Mueve la mano para rotar.</p>
        
        <label>Forma:</label>
        <div class="btn-group">
            <button onclick="setShape('heart')" class="active" id="btn-heart">Corazón</button>
            <button onclick="setShape('saturn')" id="btn-saturn">Saturno</button>
            <button onclick="setShape('flower')" id="btn-flower">Flor</button>
            <button onclick="setShape('fireworks')" id="btn-fireworks">Fuegos</button>
        </div>

        <label>Color de Partículas:</label>
        <input type="color" id="colorPicker" value="#00d2ff">
    </div>

    <video class="input_video"></video>
    <canvas id="canvas3d"></canvas>

    <script>
        // --- CONFIGURACIÓN THREE.JS ---
        const scene = new THREE.Scene();
        // Niebla suave para profundidad
        scene.fog = new THREE.FogExp2(0x050505, 0.002);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 30;

        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas3d'), alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);

        // --- SISTEMA DE PARTÍCULAS ---
        const PARTICLE_COUNT = 15000; // Cantidad de partículas
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(PARTICLE_COUNT * 3);
        const targetPositions = new Float32Array(PARTICLE_COUNT * 3); // A donde quieren ir las partículas
        
        // Inicializar posiciones aleatorias
        for (let i = 0; i < PARTICLE_COUNT * 3; i++) {
            positions[i] = (Math.random() - 0.5) * 100;
            targetPositions[i] = positions[i];
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

        // Textura simple para la partícula (círculo difuso generado por código para no cargar imagenes externas)
        const getTexture = () => {
            const canvas = document.createElement('canvas');
            canvas.width = 32; canvas.height = 32;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createRadialGradient(16,16,0,16,16,16);
            grad.addColorStop(0, 'rgba(255,255,255,1)');
            grad.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0,0,32,32);
            const texture = new THREE.Texture(canvas);
            texture.needsUpdate = true;
            return texture;
        };

        const material = new THREE.PointsMaterial({
            size: 0.3,
            color: 0x00d2ff,
            map: getTexture(),
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        const particles = new THREE.Points(geometry, material);
        scene.add(particles);

        // --- MATEMÁTICAS DE LAS FORMAS ---
        // Funciones paramétricas para generar coordenadas objetivo

        function getHeartPoint(t, res) {
            // Ecuación paramétrica 3D del corazón
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
            const z = res; 
            return {x: x * 0.5, y: y * 0.5, z: z * 2}; // Escala
        }

        function getSpherePoint() {
            const u = Math.random();
            const v = Math.random();
            const theta = 2 * Math.PI * u;
            const phi = Math.acos(2 * v - 1);
            const r = 10 + Math.random() * 2; // Radio con variación
            return {
                x: r * Math.sin(phi) * Math.cos(theta),
                y: r * Math.sin(phi) * Math.sin(theta),
                z: r * Math.cos(phi)
            };
        }

        function getSaturnPoint(i) {
            // 70% esfera, 30% anillos
            if (i < PARTICLE_COUNT * 0.7) {
                const p = getSpherePoint();
                return {x: p.x * 0.6, y: p.y * 0.6, z: p.z * 0.6}; // Planeta más pequeño
            } else {
                // Anillo
                const angle = Math.random() * Math.PI * 2;
                const dist = 12 + Math.random() * 6; // Radio interno 12, externo 18
                return {
                    x: Math.cos(angle) * dist,
                    y: (Math.random() - 0.5) * 0.5, // Muy plano en Y
                    z: Math.sin(angle) * dist
                };
            }
        }

        function getFlowerPoint() {
            const u = Math.random() * Math.PI * 2;
            const v = Math.random() * Math.PI;
            const r = 10 * Math.sin(3 * u) * Math.sin(4 * v); // Ecuación rosa polar 3D
            return {
                x: r * Math.sin(u) * Math.cos(v),
                y: r * Math.sin(u) * Math.sin(v),
                z: r * Math.cos(u)
            };
        }

        // --- LÓGICA DE TRANSICIÓN DE FORMAS ---
        let currentShape = 'heart';

        function updateTargets() {
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                let p = {x:0, y:0, z:0};
                const idx = i * 3;
                
                if (currentShape === 'heart') {
                    // Distribución aleatoria sobre la curva
                    p = getHeartPoint(Math.random() * Math.PI * 2, (Math.random()-0.5) * 5);
                } else if (currentShape === 'saturn') {
                    p = getSaturnPoint(i);
                } else if (currentShape === 'flower') {
                    p = getFlowerPoint();
                } else if (currentShape === 'fireworks') {
                    // Esfera expandida
                    const sp = getSpherePoint();
                    p = {x: sp.x * 1.5, y: sp.y * 1.5, z: sp.z * 1.5};
                }

                targetPositions[idx] = p.x;
                targetPositions[idx + 1] = p.y;
                targetPositions[idx + 2] = p.z;
            }
        }

        // Inicializar
        updateTargets();

        // Control UI
        window.setShape = (shape) => {
            currentShape = shape;
            updateTargets();
            // Actualizar botones
            document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-${shape}`).classList.add('active');
        };

        document.getElementById('colorPicker').addEventListener('input', (e) => {
            material.color.set(e.target.value);
        });


        // --- INTEGRACIÓN MEDIAPIPE HANDS (GESTOS) ---
        let handOpenFactor = 0; // 0 = cerrado (puño), 1 = abierto
        let handPosition = { x: 0, y: 0 };
        let isHandDetected = false;

        const videoElement = document.getElementsByClassName('input_video')[0];

        function onResults(results) {
            document.getElementById('loading').style.display = 'none';
            
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                isHandDetected = true;
                document.getElementById('cam-status').classList.add('status-active');
                
                const landmarks = results.multiHandLandmarks[0];

                // 1. Calcular posición de la mano (Centro aproximado - Palma)
                // Usamos la muñeca (0) y el dedo medio (9)
                const palmX = landmarks[9].x; 
                const palmY = landmarks[9].y;

                // Mapear de [0,1] a coordenadas normalizadas [-1, 1] invertidas en X (efecto espejo)
                // El video viene en espejo, así que: (1 - x) invierte, luego centramos.
                handPosition.x = (0.5 - palmX) * 30; // Multiplicador para sensibilidad
                handPosition.y = (0.5 - palmY) * 20;

                // 2. Calcular Apertura (Gestos Avanzados)
                // Distancia promedio de las puntas de los dedos a la muñeca
                const wrist = landmarks[0];
                const tips = [4, 8, 12, 16, 20]; // IDs de las puntas
                let avgDist = 0;

                tips.forEach(tipId => {
                    const tip = landmarks[tipId];
                    const d = Math.sqrt(Math.pow(tip.x - wrist.x, 2) + Math.pow(tip.y - wrist.y, 2));
                    avgDist += d;
                });
                avgDist /= tips.length;

                // Calibración aproximada: Puño ~0.15, Mano abierta ~0.4+
                // Normalizamos entre 0 y 1
                let openness = (avgDist - 0.15) / (0.4 - 0.15);
                openness = Math.max(0, Math.min(1, openness)); // Clampear
                
                // Suavizado (Lerp) para que no tiemble
                handOpenFactor += (openness - handOpenFactor) * 0.1;

            } else {
                isHandDetected = false;
                document.getElementById('cam-status').classList.remove('status-active');
                // Si no hay mano, volver a estado neutral suavemente
                handOpenFactor += (0.5 - handOpenFactor) * 0.05;
                handPosition.x += (0 - handPosition.x) * 0.05;
                handPosition.y += (0 - handPosition.y) * 0.05;
            }
        }

        const hands = new Hands({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }});

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        hands.onResults(onResults);

        const cameraUtils = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({image: videoElement});
            },
            width: 640,
            height: 480
        });
        
        // Iniciar cámara con manejo de errores básico
        cameraUtils.start().catch(e => {
            alert("Error al acceder a la cámara. Asegúrate de dar permisos.");
            console.error(e);
        });


        // --- BUCLE DE ANIMACIÓN ---
        let time = 0;

        function animate() {
            requestAnimationFrame(animate);
            time += 0.01;

            // 1. Morphing de partículas
            const positionsArray = particles.geometry.attributes.position.array;
            
            // Factor de explosión basado en la mano
            // Si la mano está cerrada (0), scaleFactor < 1 (implosión)
            // Si la mano está abierta (1), scaleFactor > 1 (explosión)
            // Rango mapeado: 0.2 (muy cerrado) a 2.5 (muy abierto)
            const gestureScale = 0.5 + (handOpenFactor * 2.0); 

            // Rotación basada en la posición de la mano en X
            particles.rotation.y += 0.002 + (handPosition.x * 0.001);
            particles.rotation.x = -(handPosition.y * 0.05);

            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const idx = i * 3;
                
                // Posición objetivo base
                let tx = targetPositions[idx];
                let ty = targetPositions[idx + 1];
                let tz = targetPositions[idx + 2];

                // Aplicar Ruido/Movimiento orgánico ("respiración")
                tx += Math.sin(time + ty * 0.1) * 0.2;
                ty += Math.cos(time + tx * 0.1) * 0.2;

                // Interpolar posición actual hacia objetivo (Morphing suave)
                // Velocidad 0.05
                positionsArray[idx] += (tx * gestureScale - positionsArray[idx]) * 0.08;
                positionsArray[idx + 1] += (ty * gestureScale - positionsArray[idx + 1]) * 0.08;
                positionsArray[idx + 2] += (tz * gestureScale - positionsArray[idx + 2]) * 0.08;
            }

            particles.geometry.attributes.position.needsUpdate = true;
            
            // Reaccionar al color si es fuegos artificiales (efecto arcoiris)
            if(currentShape === 'fireworks') {
                const h = (time * 0.2) % 1;
                material.color.setHSL(h, 1, 0.5);
            }

            renderer.render(scene, camera);
        }

        // Manejo de resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();

    </script>
</body>
</html>
