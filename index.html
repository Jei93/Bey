<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partículas Gestuales Óptimo</title>
    <style>
        body { margin: 0; overflow: hidden; background: radial-gradient(circle at center, #0a0a1a, #000); font-family: 'Segoe UI', sans-serif; }
        canvas { display: block; }
        .input_video { display: none; }

        #ui-container {
            position: absolute;
            top: 20px;
            left: -270px;
            width: 250px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(15px);
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            z-index: 10;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.9);
            transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #ui-container.visible { left: 20px; }

        h1 {
            font-size: 1.1rem;
            margin: 0 0 15px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #ff0055, #00ffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        #toggle-ui {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 40px;
            height: 40px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            z-index: 11;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #toggle-ui:hover { transform: scale(1.1); background: rgba(255, 255, 255, 0.1); }

        #gesture-hud {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            padding: 12px 25px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 0.75rem;
            z-index: 10;
            opacity: 0.9;
            transition: opacity 0.3s;
            text-align: center;
        }

        #gesture-debug {
            position: absolute;
            top: 120px;
            left: 20px;
            color: #0ff;
            font-family: monospace;
            font-size: 0.7rem;
            z-index: 10;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 5px;
            max-width: 200px;
        }

        .gesture-row {
            margin: 5px 0;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .gesture-item { display: flex; align-items: center; gap: 5px; }

        .control-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 0.85rem; color: #ccc; }
        
        select, input[type="color"], input[type="range"] {
            width: 100%; padding: 8px; border-radius: 5px; border: none;
            background: rgba(255, 255, 255, 0.1); color: white; outline: none; cursor: pointer;
        }

        .status {
            margin-top: 15px; padding: 10px; border-radius: 5px; font-size: 0.8rem;
            background: rgba(255, 255, 255, 0.05); line-height: 1.6;
        }

        #loading {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: white; font-size: 1.2rem; pointer-events: none;
            background: rgba(0, 0, 0, 0.8); padding: 20px; border-radius: 10px;
            text-align: center;
        }

        #mode-indicator {
            position: absolute;
            top: 70px;
            left: 20px;
            padding: 6px 12px;
            background: rgba(0, 255, 136, 0.2);
            color: #0ff;
            border-radius: 15px;
            font-size: 0.7rem;
            z-index: 10;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        #mode-indicator.visible { opacity: 1; }

        #fps-counter {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #0f0;
            font-family: monospace;
            font-size: 0.8rem;
            background: rgba(0, 0, 0, 0.5);
            padding: 5px 10px;
            border-radius: 5px;
            z-index: 10;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
</head>
<body>

    <div id="loading">
        🎮 Cargando IA...<br>
        <small style="font-size:0.8rem; color:#aaa;">Permite la cámara</small>
    </div>

    <button id="toggle-ui">☰</button>
    <div id="mode-indicator"></div>
    <div id="fps-counter">FPS: <span id="fps">0</span></div>
    <div id="gesture-debug"></div>

    <div id="ui-container">
        <h1>Control Gestual</h1>
        
        <div class="control-group">
            <label>Forma Actual: <span id="forma">Corazón</span></label>
            <select id="shape-selector">
                <option value="heart">❤️ Corazón</option>
                <option value="cross">✝️ Cruz</option>
                <option value="star">⭐ Estrella</option>
                <option value="flower">🌸 Flor</option>
                <option value="fireworks">✨ Explosión</option>
            </select>
        </div>

        <div class="control-group">
            <label>Color</label>
            <input type="color" id="color-picker" value="#ff0055">
        </div>

        <div class="control-group">
            <label>Sensibilidad <span id="sens-value">1.0</span>x</label>
            <input type="range" id="sens-slider" min="0.5" max="2" step="0.1" value="1">
        </div>

        <div class="control-group">
            <label>Velocidad Forma <span id="lerp-value">0.12</span></label>
            <input type="range" id="lerp-slider" min="0.05" max="0.3" step="0.01" value="0.12">
        </div>

        <div class="status">
            <div>🤚 Manos: <span id="hand-count">0</span></div>
            <div>⚡ Vel: <span id="velocity">0</span></div>
            <div>🔍 Zoom: <span id="zoom-level">1.0</span>x</div>
        </div>
    </div>

    <div id="gesture-hud">
        <div class="gesture-row">
            <div class="gesture-item">👋 Swipe</div>
            <div class="gesture-item">✊ Escala</div>
            <div class="gesture-item">🤏 Gira</div>
            <div class="gesture-item">👏 Explota</div>
        </div>
    </div>

    <video class="input_video"></video>

    <script>
        // === THREE.JS SETUP PERFORMANCE ===
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x05051a);
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 30;

        const renderer = new THREE.WebGLRenderer({ 
            antialias: true, 
            alpha: true, 
            powerPreference: "high-performance",
            precision: "mediump"
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
        document.body.appendChild(renderer.domElement);

        // === SISTEMA DE PARTÍCULAS ESTABLE ===
        const particleCount = 12000;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const targetPositions = new Float32Array(particleCount * 3);

        for(let i = 0; i < particleCount * 3; i++) {
            positions[i] = (Math.random() - 0.5) * 80;
            targetPositions[i] = positions[i];
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

        const material = new THREE.PointsMaterial({
            size: 0.7,
            map: createParticleTexture(),
            transparent: true,
            opacity: 0.85,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            color: 0xff0055
        });

        function createParticleTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 32; canvas.height = 32;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
            gradient.addColorStop(0, 'rgba(255,255,255,1)');
            gradient.addColorStop(0.4, 'rgba(255,255,255,0.5)');
            gradient.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 32, 32);
            const texture = new THREE.Texture(canvas);
            texture.needsUpdate = true;
            return texture;
        }

        const particles = new THREE.Points(geometry, material);
        scene.add(particles);

        // === GENERADORES DE FORMAS ESTABLES ===
        function getHeartPoint(t, scale = 1) {
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
            const z = (Math.random() - 0.5) * 5;
            return new THREE.Vector3(x * scale, y * scale, z);
        }

        function getCrossPoint(i, total, scale = 1) {
            const t = (i / total) * 4;
            let x = 0, y = 0, z = (Math.random() - 0.5) * 2;
            if (t < 1) {
                x = (Math.random() - 0.5) * 0.3;
                y = (t - 0.5) * 20;
            } else if (t < 2) {
                x = (Math.random() - 0.5) * 0.3;
                y = (t - 1.5) * 20 - 10;
            } else if (t < 3) {
                x = (t - 2.5) * 20 - 10;
                y = (Math.random() - 0.5) * 0.3;
            } else {
                x = (t - 3.5) * 20;
                y = (Math.random() - 0.5) * 0.3;
            }
            return new THREE.Vector3(x * scale, y * scale, z);
        }

        function getStarPoint(i, total, scale = 1) {
            const angle = (i / total) * Math.PI * 2;
            const pointIndex = Math.floor((angle / (Math.PI * 2)) * 10);
            const isOuter = pointIndex % 2 === 0;
            const r = isOuter ? 12 : 6;
            const x = r * Math.cos(angle);
            const y = r * Math.sin(angle);
            const z = (Math.random() - 0.5) * 3;
            return new THREE.Vector3(x * scale, y * scale, z);
        }

        function getFlowerPoint(u, v, scale = 1) {
            const r = 10 + 5 * Math.cos(5 * u);
            const x = r * Math.sin(u) * Math.cos(v);
            const y = r * Math.sin(u) * Math.sin(v);
            const z = (r * Math.cos(u)) * 0.5;
            return new THREE.Vector3(x * scale, y * scale, z);
        }

        // === ACTUALIZAR FORMA (FUNCIONAL) ===
        let currentShape = 'heart';
        let lerpSpeed = 0.12; // MÁS RÁPIDO

        function updateShapeTarget() {
            console.log('FORMA CAMBIADA A:', currentShape);
            for (let i = 0; i < particleCount; i++) {
                const i3 = i * 3;
                let vec;
                
                if (currentShape === 'heart') {
                    vec = getHeartPoint((i / particleCount) * Math.PI * 20, 0.8);
                } else if (currentShape === 'cross') {
                    vec = getCrossPoint(i, particleCount, 1);
                } else if (currentShape === 'star') {
                    vec = getStarPoint(i, particleCount, 1);
                } else if (currentShape === 'flower') {
                    vec = getFlowerPoint(Math.random() * Math.PI, Math.random() * Math.PI * 2, 1.2);
                } else {
                    vec = new THREE.Vector3((Math.random() - 0.5) * 40, (Math.random() - 0.5) * 40, (Math.random() - 0.5) * 40);
                }

                targetPositions[i3] = vec.x;
                targetPositions[i3+1] = vec.y;
                targetPositions[i3+2] = vec.z;
            }
        }

        updateShapeTarget();

        // === GESTURE TRACKER ULTRA ESTABLE ===
        class GestureTracker {
            constructor() {
                this.hands = [];
                this.history = new Array(8).fill(null);
                this.historyIndex = 0;
                this.lastTime = performance.now();
                this.gestureCooldown = 0;
                this.zoomSmooth = 1;
                this.lastClapTime = 0;
                this.sensitivity = 1;
                
                this.gestures = {
                    swipe: { left: 0, right: 0, up: 0, down: 0 },
                    rotate: { x: 0, y: 0 },
                    clap: 0,
                    zoom: 1
                };
            }

            update(results, sensitivity = 1) {
                const now = performance.now();
                const deltaTime = (now - this.lastTime) / 1000;
                this.lastTime = now;
                this.sensitivity = sensitivity;
                this.gestureCooldown = Math.max(0, this.gestureCooldown - deltaTime);

                this.hands = [];
                if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                    results.multiHandLandmarks.forEach((landmarks, index) => {
                        const hand = this.processHand(landmarks, index, deltaTime);
                        this.hands.push(hand);
                    });
                }

                // Resetear gestos
                this.gestures.swipe = { left: 0, right: 0, up: 0, down: 0 };
                this.gestures.rotate = { x: 0, y: 0 };
                this.gestures.clap = 0;

                // Historia circular
                this.history[this.historyIndex] = { hands: this.hands, time: now };
                this.historyIndex = (this.historyIndex + 1) % this.history.length;

                this.detectGestures();
            }

            processHand(landmarks, index, deltaTime) {
                const wrist = landmarks[0];
                const indexTip = landmarks[8];
                const thumbTip = landmarks[4];
                
                const pos = new THREE.Vector3(wrist.x * 100 - 50, -wrist.y * 100 + 50, wrist.z * 10);
                
                let velocity = new THREE.Vector3();
                const lastEntry = this.history[(this.historyIndex - 1 + this.history.length) % this.history.length];
                if (lastEntry && lastEntry.hands[index]) {
                    velocity.subVectors(pos, lastEntry.hands[index].position).divideScalar(deltaTime || 0.016);
                }

                // Apertura de mano
                const tips = [4, 8, 12, 16, 20];
                let totalDist = 0;
                tips.forEach(tipIdx => {
                    const tip = landmarks[tipIdx];
                    totalDist += Math.sqrt(Math.pow(tip.x - wrist.x, 2) + Math.pow(tip.y - wrist.y, 2));
                });
                const openness = Math.max(0, Math.min(1, (totalDist / 5 - 0.15) * 3.5));

                const pinchDist = Math.sqrt(Math.pow(thumbTip.x - indexTip.x, 2) + Math.pow(thumbTip.y - indexTip.y, 2));
                
                return {
                    position: pos,
                    velocity: velocity,
                    openness: openness,
                    isPinching: pinchDist < 0.08,
                    handedness: index
                };
            }

            detectGestures() {
                if (this.hands.length === 0) return;

                // Swipe
                const oldest = this.history[this.historyIndex];
                if (oldest && oldest.hands[0]) {
                    const delta = this.hands[0].position.clone().sub(oldest.hands[0].position);
                    const threshold = 20 / this.sensitivity;
                    
                    if (Math.abs(delta.x) > threshold) {
                        this.gestures.swipe[delta.x < 0 ? 'left' : 'right'] = 1;
                    }
                    if (Math.abs(delta.y) > threshold) {
                        this.gestures.swipe[delta.y < 0 ? 'up' : 'down'] = 1;
                    }
                }

                // Pinch rotate
                if (this.hands[0].isPinching) {
                    // MÁS SENSIBLE
                    this.gestures.rotate.x = this.hands[0].velocity.y * 0.01 * this.sensitivity;
                    this.gestures.rotate.y = this.hands[0].velocity.x * 0.01 * this.sensitivity;
                }

                // Zoom y clap
                if (this.hands.length === 2) {
                    const dist = this.hands[0].position.distanceTo(this.hands[1].position);
                    const targetZoom = Math.max(0.3, Math.min(3, dist / 50));
                    this.zoomSmooth += (targetZoom - this.zoomSmooth) * 0.1;
                    this.gestures.zoom = this.zoomSmooth;

                    // CLAP DETECTADO POR DISTANCIA NOMÁS
                    if (dist < 25 && this.gestureCooldown === 0) {
                        const now = performance.now();
                        if (now - this.lastClapTime > 800) {
                            this.gestures.clap = 1;
                            this.lastClapTime = now;
                            this.gestureCooldown = 0.5;
                        }
                    }
                }
            }
        }

        const gestureTracker = new GestureTracker();

        // === MEDIAPIPE ===
        const videoElement = document.querySelector('.input_video');

        function onResults(results) {
            document.getElementById('loading').style.display = 'none';
            gestureTracker.update(results);

            const handCount = gestureTracker.hands.length;
            document.getElementById('hand-count').textContent = handCount;
            document.getElementById('velocity').textContent = gestureTracker.hands[0]?.velocity.length().toFixed(0) || 0;
            document.getElementById('zoom-level').textContent = gestureTracker.gestures.zoom.toFixed(1);
            
            // DEBUG VISUAL
            const debug = document.getElementById('gesture-debug');
            const g = gestureTracker.gestures;
            const active = [];
            if (g.swipe.left || g.swipe.right) active.push(`SWIPE-${g.swipe.left ? 'LEFT' : 'RIGHT'}`);
            if (g.clap) active.push('CLAP!');
            if (g.rotate.x || g.rotate.y) active.push('ROTATE');
            debug.innerHTML = `<strong>Gestos:</strong><br>${active.join('<br>') || 'Ninguno'}`;
        }

        const hands = new Hands({locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});
        hands.setOptions({ maxNumHands: 2, modelComplexity: 1, minDetectionConfidence: 0.7, minTrackingConfidence: 0.7 });
        hands.onResults(onResults);

        const cameraUtils = new Camera(videoElement, {
            onFrame: async () => await hands.send({image: videoElement}),
            width: 640,
            height: 480
        });
        cameraUtils.start();

        // === CONTROLES UI ===
        const toggleBtn = document.getElementById('toggle-ui');
        const uiContainer = document.getElementById('ui-container');
        let uiVisible = false;

        toggleBtn.addEventListener('click', () => {
            uiVisible = !uiVisible;
            uiContainer.classList.toggle('visible', uiVisible);
            toggleBtn.textContent = uiVisible ? '✕' : '☰';
        });

        document.getElementById('shape-selector').addEventListener('change', (e) => {
            currentShape = e.target.value;
            document.getElementById('forma').textContent = e.target.options[e.target.selectedIndex].text;
            updateShapeTarget();
        });

        document.getElementById('color-picker').addEventListener('input', (e) => {
            material.color.set(e.target.value);
        });

        document.getElementById('sens-slider').addEventListener('input', (e) => {
            gestureTracker.sensitivity = parseFloat(e.target.value);
            document.getElementById('sens-value').textContent = gestureTracker.sensitivity.toFixed(1);
        });

        document.getElementById('lerp-slider').addEventListener('input', (e) => {
            lerpSpeed = parseFloat(e.target.value);
            document.getElementById('lerp-value').textContent = lerpSpeed.toFixed(2);
        });

        // === BUCLE DE ANIMACIÓN CORREGIDO ===
        const clock = new THREE.Clock();
        let rotationX = 0, rotationY = 0, explosionForce = 0, lastExplosion = 0;
        let frameCount = 0;

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();
            const delta = Math.min(clock.getDelta(), 0.033);

            // FPS
            frameCount++;
            if (frameCount % 60 === 0) {
                document.getElementById('fps').textContent = Math.round(1 / delta);
            }

            // GESTOS
            const gestures = gestureTracker.gestures;
            const handCount = gestureTracker.hands.length;
            const avgOpenness = handCount > 0 ? 
                gestureTracker.hands.reduce((sum, h) => sum + h.openness, 0) / handCount : 0.5;
            
            // ESCALA
            const targetScale = Math.max(0.3, 0.5 + avgOpenness * gestures.zoom);
            particles.scale.lerp(new THREE.Vector3(targetScale, targetScale, targetScale), 0.12);

            // ROTACIÓN (más sensible)
            if (Math.abs(gestures.rotate.x) > 0.01 || Math.abs(gestures.rotate.y) > 0.01) {
                rotationX += gestures.rotate.x * 0.5;
                rotationY += gestures.rotate.y * 0.5;
            }
            particles.rotation.x += rotationX * delta * 30;
            particles.rotation.y += rotationY * delta * 30;
            rotationX *= 0.95;
            rotationY *= 0.95;

            // EXPLOSIÓN
            if (gestures.clap) {
                explosionForce = 6;
                const indicator = document.getElementById('mode-indicator');
                indicator.textContent = '💥 ¡EXPLOSIÓN!';
                indicator.classList.add('visible');
                setTimeout(() => indicator.classList.remove('visible'), 800);
            }
            explosionForce *= 0.88;

            // SWIPE
            if ((gestures.swipe.left || gestures.swipe.right) && gestureTracker.gestureCooldown === 0) {
                const select = document.getElementById('shape-selector');
                const dir = gestures.swipe.left ? -1 : 1;
                select.selectedIndex = (select.selectedIndex + dir + select.options.length) % select.options.length;
                currentShape = select.value;
                document.getElementById('forma').textContent = select.options[select.selectedIndex].text;
                updateShapeTarget();
                gestureTracker.gestureCooldown = 0.6;
                
                const indicator = document.getElementById('mode-indicator');
                indicator.textContent = `Forma: ${select.options[select.selectedIndex].text}`;
                indicator.classList.add('visible');
                setTimeout(() => indicator.classList.remove('visible'), 1000);
            }

            // ACTUALIZAR PARTÍCULAS
            const posAttr = geometry.attributes.position;
            const lerpFactor = Math.min(lerpSpeed * delta * 60, 0.3);
            const noiseAmp = explosionForce * 0.3;
            
            for (let i = 0; i < particleCount; i++) {
                const i3 = i * 3;
                
                let tx = targetPositions[i3] * targetScale;
                let ty = targetPositions[i3+1] * targetScale;
                let tz = targetPositions[i3+2] * targetScale;

                if (explosionForce > 0.1) {
                    tx += (Math.sin(i + time) - 0.5) * noiseAmp;
                    ty += (Math.cos(i + time) - 0.5) * noiseAmp;
                    tz += (Math.sin(i * 0.5 + time) - 0.5) * noiseAmp;
                }

                posAttr.array[i3] += (tx - posAttr.array[i3]) * lerpFactor;
                posAttr.array[i3+1] += (ty - posAttr.array[i3+1]) * lerpFactor;
                posAttr.array[i3+2] += (tz - posAttr.array[i3+2]) * lerpFactor;
            }

            posAttr.needsUpdate = true;
            renderer.render(scene, camera);
        }

        // === RESPALDO MOUSE ===
        renderer.domElement.addEventListener('mousemove', (e) => {
            if (e.buttons === 1) {
                rotationY += e.movementX * 0.008;
                rotationX += e.movementY * 0.008;
            }
        });

        renderer.domElement.addEventListener('wheel', (e) => {
            particles.scale.multiplyScalar(e.deltaY > 0 ? 0.95 : 1.05);
        });

        // === LIMPIEZA ===
        window.addEventListener('beforeunload', () => {
            geometry.dispose();
            material.dispose();
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
